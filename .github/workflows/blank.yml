name: Build AppleCharge80

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build AppleCharge80
        run: |
          xcodebuild \
            -project AppleCharge80.xcodeproj \
            -scheme AppleCharge80 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Check built app
        run: |
          ls -la build/Build/Products/Release-iphoneos/
          test -d build/Build/Products/Release-iphoneos/AppleCharge80.app

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/AppleCharge80.app \
            Payload/AppleCharge80.app

          zip -r AppleCharge80.ipa Payload

          ls -lh AppleCharge80.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppleCharge80-ipa
          path: AppleCharge80.ipa
          if-no-files-found: error
