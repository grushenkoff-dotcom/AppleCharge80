name: Build AppleCharge80

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Package AppleCharge80
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      - name: Create Info.plist
        run: |
          cat > AppleCharge80/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>AppleCharge80</string>

              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>

              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>

              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>

              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UILaunchScreen</key>
              <dict/>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Create XcodeGen project
        run: |
          cat > project.yml <<'EOF'
          name: AppleCharge80

          options:
            bundleIdPrefix: com.grushenkoff
            deploymentTarget:
              iOS: "17.0"

          targets:
            AppleCharge80:
              type: application
              platform: iOS
              deploymentTarget: "17.0"

              sources:
                - path: AppleCharge80
                  excludes:
                    - Info.plist
                    - Assets.xcassets

              resources:
                - path: AppleCharge80/Assets.xcassets

              info:
                path: AppleCharge80/Info.plist

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.grushenkoff.AppleCharge80
                  PRODUCT_NAME: AppleCharge80
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"

                configs:
                  Debug:
                    SWIFT_OPTIMIZATION_LEVEL: "-Onone"

                  Release:
                    SWIFT_OPTIMIZATION_LEVEL: "-O"
          EOF

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -f AppleCharge80.xcodeproj/project.pbxproj
          echo "Xcode project successfully generated"

      - name: Show project structure
        run: |
          find AppleCharge80 -maxdepth 2 -type f | sort
          echo "Generated project:"
          ls -la AppleCharge80.xcodeproj

      - name: Build AppleCharge80
        run: |
          xcodebuild \
            -project AppleCharge80.xcodeproj \
            -scheme AppleCharge80 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Archive AppleCharge80
        run: |
          xcodebuild \
            -project AppleCharge80.xcodeproj \
            -scheme AppleCharge80 \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/AppleCharge80.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Verify archive
        run: |
          test -d build/AppleCharge80.xcarchive
          test -d build/AppleCharge80.xcarchive/Products/Applications/AppleCharge80.app
          echo "Archive successfully created"

      - name: Create unsigned IPA
        run: |
          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R \
            build/AppleCharge80.xcarchive/Products/Applications/AppleCharge80.app \
            ipa/Payload/AppleCharge80.app

          cd ipa
          zip -r ../AppleCharge80-unsigned.ipa Payload

      - name: Verify IPA
        run: |
          test -f AppleCharge80-unsigned.ipa
          ls -lh AppleCharge80-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppleCharge80-unsigned-IPA
          path: AppleCharge80-unsigned.ipa
          retention-days: 7

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: AppleCharge80-xcarchive
          path: build/AppleCharge80.xcarchive
          retention-days: 7
