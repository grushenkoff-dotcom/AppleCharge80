name: Build AppleCharge80

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build AppleCharge80
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          echo "Repository:"
          pwd
          echo
          echo "Files:"
          find . -maxdepth 4 -type f | sort

      - name: Find Xcode project
        run: |
          echo "Searching for Xcode project..."
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build AppleCharge80
        run: |
          xcodebuild \
            -project AppleCharge80.xcodeproj \
            -scheme AppleCharge80 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package build
        run: |
          mkdir -p artifacts
          cp -R build/Build/Products/Release-iphoneos/AppleCharge80.app artifacts/

      - name: Upload AppleCharge80.app
        uses: actions/upload-artifact@v4
        with:
          name: AppleCharge80-app
          path: artifacts/AppleCharge80.app
