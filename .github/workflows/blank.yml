name: Build AppleCharge80

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build AppleCharge80
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project.yml
        run: |
          cat > project.yml <<'EOF'
          name: AppleCharge80

          options:
            bundleIdPrefix: com.grushenkoff
            deploymentTarget:
              iOS: "17.0"

          targets:
            AppleCharge80:
              type: application
              platform: iOS
              deploymentTarget: "17.0"

              sources:
                - path: AppleCharge80

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.grushenkoff.AppleCharge80
                  PRODUCT_NAME: AppleCharge80
                  SWIFT_VERSION: "5.0"
                  INFOPLIST_KEY_CFBundleDisplayName: AppleCharge80
                  INFOPLIST_KEY_LSRequiresIPhoneOS: YES
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Build AppleCharge80
        run: |
          xcodebuild \
            -project AppleCharge80.xcodeproj \
            -scheme AppleCharge80 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Upload AppleCharge80.app
        uses: actions/upload-artifact@v4
        with:
          name: AppleCharge80-app
          path: build/Build/Products/Release-iphoneos/AppleCharge80.app
