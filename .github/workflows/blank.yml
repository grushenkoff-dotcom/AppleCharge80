name: Build AppleCharge80

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Package AppleCharge80
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Clean build
        run: |
          xcodebuild \
            -project AppleCharge80/AppleCharge80.xcodeproj \
            -scheme AppleCharge80 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Archive AppleCharge80
        run: |
          xcodebuild \
            -project AppleCharge80/AppleCharge80.xcodeproj \
            -scheme AppleCharge80 \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/AppleCharge80.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create unsigned IPA
        run: |
          mkdir -p ipa/Payload

          cp -R \
            build/AppleCharge80.xcarchive/Products/Applications/AppleCharge80.app \
            ipa/Payload/AppleCharge80.app

          cd ipa
          zip -r ../AppleCharge80-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppleCharge80-unsigned-IPA
          path: AppleCharge80-unsigned.ipa
          retention-days: 7

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: AppleCharge80-xcarchive
          path: build/AppleCharge80.xcarchive
          retention-days: 7
